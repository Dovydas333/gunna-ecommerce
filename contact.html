<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunna | E-SHOP</title>
    <link rel="icon" href="/hoodie.png" type="image/png">
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>

<body>

<header class="header">
    <div class="wrapper">
        <nav aria-label="Main navigation">

            <h1 class="logo"><a href="index.html#hero">🛒 GUNNA </a></h1>

            <button class="hamburger" id="hamburger-btn" aria-label="Open navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul id="nav-links">
                <li><a href="index.html#hero">Home</a></li>
                <li><a href="index.html#shop">Shop</a></li>
                <li><a href="index.html#hero2">Minimal collection</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

          <div class="cart-info">
    <span>🛒 Cart: <span id="cart-count">0</span> | $<span id="total-price">0</span></span>
    <button class="clear-btn" id="clear-cart-btn">Clear</button>
</div>

        </nav>
    </div>
</header>

<main>
<section>

    <div class="wrapper">
        <div class="contact">
            <h2>CONTACT</h2>
            <p>
                If you have any questions about our product or business, feel free to contact us using the form below or email us at info@gunna.com.
            </p>
        </div>
    </div>

    <div class="wrapper contact-layout">

        <div class="contact-image">
            <img src="contact.jpg" id="contactjpg" alt="contact clothing" loading="lazy">
        </div>

        <article id="contactform">
            <form action="https://httpbin.org/post" method="post">

                <label for="name">Name:</label>
                <input type="text" name="name" id="name" placeholder="Your name" autocomplete="on" required autofocus>

                <p>
                    <label for="last-name">Last Name:</label>
                    <input type="text" name="last-name" id="last-name" placeholder="Your last name" autocomplete="on" required>
                </p>

                <p>
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password" placeholder="Your password" required>
                </p>

                <p>
                    <label for="phone">Phone:</label>
                    <input type="tel" name="phone" id="phone" placeholder="Phone" pattern="[0-9]{9,12}" required>
                </p>

                <button type="submit">SUBMIT NOW</button>

            </form>
        </article>

    </div>

</section>


    </div> 
</section>
</main>

<footer class="footer">
  <div class="footer-wrapper">

    <div class="footer-left">
      <p>© 2026 GUNNA</p>
    </div>

    <div class="footer-right">
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>

  </div>
</footer>

<script src="script.js"></script>

</body>
</html>

<body>

<header class="header">
    <div class="wrapper">
        <nav aria-label="Main navigation">

            <div class="logo"><a href="index.html#hero">🛒 GUNNA</a></div>

            <button class="hamburger" id="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-links">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul id="nav-links">
                <li><a href="index.html#hero">Home</a></li>
                <li><a href="index.html#shop">Shop</a></li>
                <li><a href="index.html#hero2">Minimal collection</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="cart-info">
                <a href="cart.html" class="cart-btn-link" aria-label="Shopping cart">
                    🛒 <span class="cart-label">Cart</span> 
                    <span id="cart-count">0</span> (<span id="total-price">0.00</span> €)
                </a>
            </div>

        </nav>
    </div>
</header>

<main>
    <section>
        <div class="wrapper">
            <div class="contact">
                <h1>CONTACT</h1>
                <p>
                    If you have any questions about our product or business, feel free to contact us using the form below or email us at info@gunna.com.
                </p>
            </div>
        </div>

        <div class="wrapper contact-layout">

            <div class="contact-image">
                <img src="contact.jpg" id="contactjpg" alt="contact clothing" loading="lazy">
            </div>

            <article id="contactform">
               
                <form id="emailjs-form">

                    <p>
                        <label for="user_name">Name:</label>
                        <input type="text" name="user_name" id="user_name" placeholder="Your name" autocomplete="name" required autofocus>
                    </p>

                    <p>
                        <label for="user_email">Email Address:</label>
                        <input type="email" name="user_email" id="user_email" placeholder="Your email address" autocomplete="email" required>
                    </p>

                    <p>
                        <label for="user_phone">Phone (optional):</label>
                        <input type="tel" name="user_phone" id="user_phone" placeholder="Your phone number" autocomplete="tel">
                    </p>

                    <p>
                        <label for="message">Message:</label>
                        <textarea name="message" id="message" placeholder="Write your message here..." rows="5" required></textarea>
                    </p>

                    <button type="submit" id="submit-btn">SUBMIT NOW</button>

                </form>
            </article>

        </div>
    </section>
</main>

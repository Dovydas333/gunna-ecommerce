<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Dovydas Valančius">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunna | E-SHOP</title>
    <link rel="icon" href="/hoodie.png" type="image/png">
    <link rel="stylesheet" href="styles.css" type="text/css">
    
</head>

<body>

<header class="header">
    <div class="wrapper">
        <nav aria-label="Main navigation">

            <h1 class="logo"><a href="index.html#hero">🛒 GUNNA </a></h1>

            <button class="hamburger" id="hamburger-btn" aria-label="Open navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul id="nav-links">
                <li><a href="index.html#hero">Home</a></li>
                <li><a href="index.html#shop">Shop</a></li>
                <li><a href="index.html#hero2">Minimal collection</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

           <div class="cart-info">
    <span>🛒 Cart: <span id="cart-count">0</span> | $<span id="total-price">0</span></span>
    <button class="clear-btn" id="clear-cart-btn">Clear</button>
</div>

        </nav>
    </div>
</header>

<main>

<section class="collection">
    <div class="wrapper">

        <h2>Spring Collection</h2>

        <div class="products">

            <article class="product-card">
                <img src="hoodie2.jpg" alt="Hoodie" loading="lazy">
                <h3>Minimal Hoodie</h3>
                <p class="price">$49</p>
                <button class="btn1 add-to-cart-btn" data-price="49">Add To Cart</button>
            </article>

            <article class="product-card">
                <img src="tshirt.jpg" alt="T-shirt" loading="lazy">
                <h3>Classic T-Shirt</h3>
                <p class="price">$29</p>
                <button class="btn1 add-to-cart-btn" data-price="29">Add To Cart</button>
            </article>

            <article class="product-card">
                <img src="sweater.jpg" alt="Sweater" loading="lazy">
                <h3>Spring Sweater</h3>
                <p class="price">$59</p>
                <button class="btn1 add-to-cart-btn" data-price="59">Add To Cart</button>
            </article>

        </div>

    </div>
</section>

</main>

<footer class="footer">
    <div class="footer-wrapper">

        <div class="footer-left">
            <p>© 2026 GUNNA</p>
        </div>

        <div class="footer-right">
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </div>

    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
